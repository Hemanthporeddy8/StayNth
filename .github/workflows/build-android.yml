name: Build StayNth Android APK & AAB

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: Build Android APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Build Android Release AAB (Google Play Store)
        working-directory: ./android
        run: gradle bundleRelease --stacktrace

      - name: Prepare Artifacts with Clean Names
        run: |
          mkdir -p dist-android
          # Copy Debug APK (can be installed on any phone with 1 tap)
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist-android/StayNth-debug.apk \;
          # Copy Release AAB (for Google Play Console)
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} dist-android/StayNth-release.aab \;
          echo "Build completed successfully. Artifacts:"
          ls -la dist-android/

      - name: Upload APK & AAB as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StayNth-Android-Packages
          path: dist-android/
          retention-days: 30

      - name: Attach APK & AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-android/StayNth-debug.apk
            dist-android/StayNth-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
