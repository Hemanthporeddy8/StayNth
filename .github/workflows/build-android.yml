name: Build StayNth Android APK & AAB

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Build Android Release AAB (Google Play Store)
        working-directory: ./android
        run: gradle bundleRelease --stacktrace

      - name: Prepare Artifacts with Clean Names
        run: |
          mkdir -p dist-android
          # Copy Debug APK (can be installed on any phone with 1 tap)
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist-android/StayNth.apk \;
          cp dist-android/StayNth.apk dist-android/StayNth-debug.apk
          # Copy Release AAB (for Google Play Console)
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} dist-android/StayNth.aab \;
          cp dist-android/StayNth.aab dist-android/StayNth-release.aab
          echo "Build completed successfully. Artifacts:"
          ls -la dist-android/

      - name: Upload APK & AAB as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StayNth-Android-Packages
          path: dist-android/
          retention-days: 30

      - name: Publish to GitHub Release v1.0.0
        uses: ncipollo/release-action@v1
        with:
          tag: "v1.0.0"
          name: "StayNth Android v1.0.0"
          body: "Official StayNth Android packages. Includes standalone installable APK (`StayNth.apk`) and Google Play Store AAB bundle (`StayNth.aab`)."
          artifacts: "dist-android/StayNth.apk,dist-android/StayNth.aab,dist-android/StayNth-debug.apk,dist-android/StayNth-release.aab"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
